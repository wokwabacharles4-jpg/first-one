<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account Form</title>
    <style>
        body{
            align-items: center;
            background:linear-gradient(to right,#435c91,#e5e6eb);
        }
        .details{
            background-color:rgb(133, 182, 174);
            padding: 24px;
            width:700px;
            margin-left: 100px;
            margin-right: 100px;
           /* border-color:yellow;*/
            border-radius: 24px;
        }
        .createAccountButtons button{
            background-color:rgb(129, 146, 146);
            padding:15px;
            border-radius:24px;
            margin-left: 150px;
            margin-right: 240px;
        }
        .createAccountButtons button:hover{
            background-color:rgb(213, 203, 223);    
        }
        h1{
            color:aqua;
            text-align: center;
        }
        p{
            text-align: center;
        }
        .details input[type="text"],.details input[type="email"], .details input[type="password"]{
            padding:12px;
            border-radius: 10px;
            width:60%;
            
        }
        img{
            display:block;
            margin-left:auto;
            margin-right:auto;
        }
    </style>
</head>
<body>
    <img width="500" height="250" src="file_0000000015f481f48623d80b7186d46c.png"></img>
    <h1>You are welcome.........</h1>
    <p><strong>Please enter your details for account creation</strong></p>
    <main>
        <div>
            <form action="minetoo.html" method="post">
                <div class="details">
                    <div>
                        <label for="firstName">First Name:</label>
                        <br>
                        <input type="text" id="firstName" name="firstName" placeholder="enter first name" required>
                    </div>
                    <br>
                     <div>
                        <label for="lastName">Last Name:</label>
                        <br>
                        <input type="text" id="lastName" name="lastName" placeholder="enter last name" required>
                    </div>
                    <br>
                     <div>
                        <label for="middleName">Middle Name:</label>
                        <br>
                        <input type="text" id="middleName" name="middleName" placeholder="enter middle name if any">
                    </div>
                    <br>
                     <div>
                        <label for="email">Email:</label>
                        <br>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    </div>
                    <br>
                     <div>
                        <label for="password">Password:</label>
                        <br>
                        <input type="password" id="password" name="password" placeholder="type password here" required>
                    </div>
                    <label for="gender">Gender</label>
                     <div>
                        <input type="radio" id="male" name="gender">
                        <label for="male">Male</label>
                    
                    
                        <input type="radio" id="female" name="gender">
                        <label for="female">Female</label>
                    
                    
                        <input type="radio" id="others" name="gender">
                        <label for="others">Others</label>
                    
                     </div>
                        
                </div>
                <br>
                <div class="createAccountButtons">
                    <button type="button">Save Details</button>
                    <button type="button">Cancel</button>

                </div>
            </form>
        </div>
    </main>
</body>
</html>
